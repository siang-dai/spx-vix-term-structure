name: Update daily SPX VIX-style term structure

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: America/Chicago

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch latest Cboe data and calculate all usable expirations
        run: python src/update_latest.py

      - name: Commit changed derived data and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update SPX VIX-style term structure"
            git push
          fi
